<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ozon Card Pro — Генератор продающих карточек 900x1200</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; }
    canvas { max-height: 82vh; width: auto; max-width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.6); border-radius: 14px; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col lg:flex-row" translate="no">

  <!-- Левая панель управления -->
  <div class="w-full lg:w-[460px] bg-slate-800 p-6 overflow-y-auto h-screen border-r border-slate-700 space-y-5">
    <div class="flex items-center justify-between">
      <h1 class="text-xl font-black text-blue-400 tracking-wide">OZON CARD PRO</h1>
      <span class="text-xs bg-blue-600/30 text-blue-300 px-2.5 py-1 rounded-full font-semibold">900 × 1200 px</span>
    </div>

    <!-- Блок 1: ИИ-автозаполнение -->
    <div class="bg-slate-900/70 p-4 rounded-xl border border-slate-700 space-y-3">
      <label class="block text-xs font-bold uppercase text-blue-400 tracking-wider">⚡ 1. Автозаполнение текстов (Groq AI)</label>
      <input id="aiPrompt" type="text" placeholder="Напр.: Термопринт на одежду ТПУ, не трескается" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm focus:border-blue-500 outline-none">
      <button id="aiBtn" onclick="generateWithAI()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-2.5 rounded-lg text-sm transition flex justify-center items-center gap-2 shadow-lg">
        <span>✨ Придумать тексты и плашки</span>
      </button>
    </div>

    <!-- Блок 2: Фото товара -->
    <div class="bg-slate-900/70 p-4 rounded-xl border border-slate-700 space-y-3">
      <label class="block text-xs font-bold uppercase text-slate-400 tracking-wider">📸 2. Фото товара и удаление фона</label>
      <input id="imgUpload" type="file" accept="image/*" class="w-full text-xs text-slate-300 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
      
      <div class="grid grid-cols-2 gap-2">
        <button id="aiBgBtn" onclick="removeBgAI()" class="bg-purple-600 hover:bg-purple-500 text-xs font-bold py-2 px-2 rounded-lg text-white transition shadow">
          🧠 ИИ-вырезание (GPU)
        </button>
        <button id="removeBgBtn" onclick="removeWhiteBg()" class="bg-slate-700 hover:bg-slate-600 text-xs font-bold py-2 px-2 rounded-lg text-slate-200 transition">
          🪄 Убрать 1-тонный фон
        </button>
      </div>
      <p id="bgStatus" class="text-[11px] text-amber-400 hidden"></p>

      <div class="grid grid-cols-3 gap-2 pt-1 text-xs">
        <div>
          <span class="text-slate-400 block mb-1">Масштаб</span>
          <input id="imgScale" type="range" min="20" max="180" value="90" class="w-full" oninput="drawCard()">
        </div>
        <div>
          <span class="text-slate-400 block mb-1">Позиция X</span>
          <input id="imgX" type="range" min="-300" max="300" value="0" class="w-full" oninput="drawCard()">
        </div>
        <div>
          <span class="text-slate-400 block mb-1">Позиция Y</span>
          <input id="imgY" type="range" min="-300" max="300" value="20" class="w-full" oninput="drawCard()">
        </div>
      </div>
    </div>

    <!-- Блок 3: Стиль и Фон -->
    <div class="bg-slate-900/70 p-4 rounded-xl border border-slate-700 space-y-3">
      <label class="block text-xs font-bold uppercase text-slate-400 tracking-wider">🎨 3. Шаблон дизайна</label>
      <select id="themeSelect" onchange="drawCard()" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm outline-none">
        <option value="ozon">Ozon Brand (Сине-фиолетовый неон)</option>
        <option value="dark">Dark Premium (Графит + Золото)</option>
        <option value="emerald">Fresh Eco (Изумрудный градиент)</option>
        <option value="sunset">Hot Sale (Яркий коралл + Оранж)</option>
        <option value="minimal">Clean Light (Светлый минимализм)</option>
      </select>
    </div>

    <!-- Блок 4: Тексты и плашки на картинке -->
    <div class="bg-slate-900/70 p-4 rounded-xl border border-slate-700 space-y-2.5">
      <label class="block text-xs font-bold uppercase text-slate-400 tracking-wider">📝 4. Тексты на карточке</label>
      
      <div>
        <span class="text-xs text-slate-400">Бейдж в углу (оставьте пустым, чтобы скрыть)</span>
        <input id="badgeText" type="text" value="ХИТ ПРОДАЖ" oninput="drawCard()" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-1.5 text-sm mt-0.5">
      </div>
      <div>
        <span class="text-xs text-slate-400">Главный заголовок (крупно сверху)</span>
        <input id="titleText" type="text" value="ТЕРМОПРИНТ НА ОДЕЖДУ" oninput="drawCard()" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-1.5 text-sm mt-0.5 font-bold">
      </div>
      <div>
        <span class="text-xs text-slate-400">Подзаголовок</span>
        <input id="subText" type="text" value="Премиум ТПУ пластик • Перенос утюгом" oninput="drawCard()" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-1.5 text-sm mt-0.5">
      </div>
      <div class="pt-1 space-y-2">
        <span class="text-xs text-slate-400 block">Преимущества (плашки)</span>
        <input id="b1" type="text" value="✓ Выдерживает 50+ стирок" oninput="drawCard()" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-1.5 text-sm">
        <input id="b2" type="text" value="✓ Не трескается и тянется" oninput="drawCard()" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-1.5 text-sm">
        <input id="b3" type="text" value="✓ Нанесение за 15 секунд" oninput="drawCard()" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-1.5 text-sm">
      </div>
    </div>

    <!-- Кнопка скачивания -->
    <button onclick="downloadCard()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black py-3.5 rounded-xl text-base shadow-lg transition">
      ⬇ СКАЧАТЬ КАРТОЧКУ (PNG 900×1200)
    </button>

    <!-- Блок 5: Сгенерированное SEO описание -->
    <div id="seoBox" class="hidden bg-slate-900/70 p-4 rounded-xl border border-slate-700 space-y-2">
      <label class="block text-xs font-bold uppercase text-emerald-400">📋 Готовое SEO-описание для Ozon</label>
      <textarea id="seoResult" rows="5" class="w-full bg-slate-800 border border-slate-600 rounded-lg p-2.5 text-xs text-slate-200"></textarea>
    </div>
  </div>

  <!-- Правая часть: Предпросмотр холста -->
  <div class="flex-1 flex flex-col items-center justify-center p-6 bg-slate-950 relative">
    <canvas id="cardCanvas" width="900" height="1200"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('cardCanvas');
    const ctx = canvas.getContext('2d');
    let productImg = null;
    let currentFileBlob = null;

    const themes = {
      ozon: { bg1: '#003399', bg2: '#0f172a', accent: '#3b82f6', badge: '#f91155', text: '#ffffff', sub: '#93c5fd', pillBg: 'rgba(15, 23, 42, 0.88)', pillBorder: '#3b82f6' },
      dark: { bg1: '#27272a', bg2: '#09090b', accent: '#f59e0b', badge: '#eab308', text: '#ffffff', sub: '#fde68a', pillBg: 'rgba(24, 24, 27, 0.9)', pillBorder: '#f59e0b' },
      emerald: { bg1: '#065f46', bg2: '#022c22', accent: '#10b981', badge: '#f59e0b', text: '#ffffff', sub: '#a7f3d0', pillBg: 'rgba(2, 44, 34, 0.88)', pillBorder: '#34d399' },
      sunset: { bg1: '#be123c', bg2: '#4c0519', accent: '#fb7185', badge: '#facc15', text: '#ffffff', sub: '#fecdd3', pillBg: 'rgba(76, 5, 25, 0.88)', pillBorder: '#fb7185' },
      minimal: { bg1: '#f8fafc', bg2: '#cbd5e1', accent: '#2563eb', badge: '#ef4444', text: '#0f172a', sub: '#334155', pillBg: 'rgba(255, 255, 255, 0.95)', pillBorder: '#94a3b8' }
    };

    document.getElementById('imgUpload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      currentFileBlob = file;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => { productImg = img; drawCard(); };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    function drawBox(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    // Быстрое удаление однотонного фона по угловому пикселю
    function removeWhiteBg() {
      if (!productImg) return alert('Сначала выберите фото товара!');
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = productImg.width;
      tempCanvas.height = productImg.height;
      const tCtx = tempCanvas.getContext('2d');
      tCtx.drawImage(productImg, 0, 0);
      const imgData = tCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
      const d = imgData.data;
      const bgR = d[0], bgG = d[1], bgB = d[2];
      const threshold = 50;
      for (let i = 0; i < d.length; i += 4) {
        const diff = Math.abs(d[i] - bgR) + Math.abs(d[i+1] - bgG) + Math.abs(d[i+2] - bgB);
        if (diff < threshold * 3) d[i+3] = 0;
      }
      tCtx.putImageData(imgData, 0, 0);
      const newImg = new Image();
      newImg.onload = () => { productImg = newImg; drawCard(); };
      newImg.src = tempCanvas.toDataURL();
    }

    // Нейросетевое удаление любого сложного фона в браузере (использует GPU/CPU)
    async function removeBgAI() {
      if (!currentFileBlob) return alert('Сначала выберите фото товара!');
      const btn = document.getElementById('aiBgBtn');
      const status = document.getElementById('bgStatus');
      btn.disabled = true;
      btn.innerText = '⏳ Вырезаем...';
      status.classList.remove('hidden');
      status.innerText = 'Загрузка ИИ-модели в браузер (первый раз ~10-15 сек)...';

      try {
        const module = await import('https://esm.sh/@imgly/background-removal@1.4.5');
        const removeBackground = module.default || module.removeBackground;
        const resultBlob = await removeBackground(currentFileBlob);
        const url = URL.createObjectURL(resultBlob);
        const newImg = new Image();
        newImg.onload = () => {
          productImg = newImg;
          drawCard();
          status.innerText = '✅ Фон успешно удален нейросетью!';
        };
        newImg.src = url;
      } catch (err) {
        alert('Ошибка ИИ-вырезания: ' + err.message);
        status.classList.add('hidden');
      } finally {
        btn.disabled = false;
        btn.innerText = '🧠 ИИ-вырезание (GPU)';
      }
    }

    function drawCard() {
      const themeKey = document.getElementById('themeSelect').value;
      const t = themes[themeKey] || themes.ozon;
      const title = document.getElementById('titleText').value.toUpperCase();
      const sub = document.getElementById('subText').value;
      const badge = document.getElementById('badgeText').value.toUpperCase();
      const bullets = [
        document.getElementById('b1').value,
        document.getElementById('b2').value,
        document.getElementById('b3').value
      ].filter(Boolean);

      // 1. Фон
      const grad = ctx.createLinearGradient(0, 0, 900, 1200);
      grad.addColorStop(0, t.bg1);
      grad.addColorStop(1, t.bg2);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 900, 1200);

      // Декоративное свечение в центре
      const rad = ctx.createRadialGradient(450, 620, 40, 450, 620, 440);
      rad.addColorStop(0, t.accent + '66');
      rad.addColorStop(1, 'transparent');
      ctx.fillStyle = rad;
      ctx.fillRect(0, 0, 900, 1200);

      // 2. Бейдж
      if (badge) {
        ctx.font = '900 26px Montserrat, sans-serif';
        const bw = ctx.measureText(badge).width + 50;
        ctx.fillStyle = t.badge;
        drawBox(ctx, 50, 45, bw, 54, 14);
        ctx.fill();
        ctx.fillStyle = (themeKey === 'minimal' || t.badge === '#facc15' || t.badge === '#eab308') ? '#0f172a' : '#ffffff';
        ctx.fillText(badge, 75, 81);
      }

      // 3. Главный заголовок
      ctx.fillStyle = t.text;
      ctx.font = '900 52px Montserrat, sans-serif';
      const words = title.split(' ');
      let line1 = '', line2 = '';
      words.forEach(w => {
        if ((line1 + w).length < 18 || !line1) line1 += (line1 ? ' ' : '') + w;
        else line2 += (line2 ? ' ' : '') + w;
      });
      ctx.fillText(line1, 50, 165);
      let subY = 220;
      if (line2) {
        ctx.fillText(line2, 50, 228);
        subY = 278;
      }

      // 4. Подзаголовок
      if (sub) {
        ctx.fillStyle = t.sub;
        ctx.font = '700 28px Montserrat, sans-serif';
        ctx.fillText(sub, 50, subY);
      }

      // 5. Фото товара
      if (productImg) {
        const scale = document.getElementById('imgScale').value / 100;
        const offX = parseInt(document.getElementById('imgX').value);
        const offY = parseInt(document.getElementById('imgY').value);
        const baseRatio = Math.min(720 / productImg.width, 640 / productImg.height);
        const w = productImg.width * baseRatio * scale;
        const h = productImg.height * baseRatio * scale;
        const x = (900 - w) / 2 + offX;
        const y = (1200 - h) / 2 + offY;

        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 40;
        ctx.shadowOffsetY = 20;
        ctx.drawImage(productImg, x, y, w, h);
        ctx.restore();
      } else {
        ctx.strokeStyle = t.sub;
        ctx.lineWidth = 3;
        ctx.setLineDash([12, 12]);
        drawBox(ctx, 200, 360, 500, 420, 28);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = t.sub;
        ctx.font = '700 26px Montserrat, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Загрузите фото товара слева', 450, 580);
        ctx.textAlign = 'left';
      }

      // 6. Плашки с преимуществами внизу
      let startY = 1130 - (bullets.length - 1) * 92;
      bullets.forEach((b, idx) => {
        const py = startY + idx * 92 - 60;
        ctx.font = '700 30px Montserrat, sans-serif';
        const tw = Math.min(ctx.measureText(b).width + 70, 800);

        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.35)';
        ctx.shadowBlur = 18;
        ctx.fillStyle = t.pillBg;
        drawBox(ctx, 50, py, tw, 72, 18);
        ctx.fill();

        ctx.lineWidth = 3;
        ctx.strokeStyle = t.pillBorder;
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = t.text;
        ctx.fillText(b, 82, py + 46);
      });
    }

    function downloadCard() {
      const link = document.createElement('a');
      link.download = 'ozon-card-900x1200.png';
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    }

    async function generateWithAI() {
      const prompt = document.getElementById('aiPrompt').value.trim();
      if (!prompt) return alert('Опишите товар в поле для ИИ!');
      const btn = document.getElementById('aiBtn');
      btn.innerText = '⏳ Генерация...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ product: prompt })
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        if (data.title) document.getElementById('titleText').value = data.title;
        if (data.subtitle) document.getElementById('subText').value = data.subtitle;
        if (data.badge) document.getElementById('badgeText').value = data.badge;
        if (data.bullets && data.bullets[0]) document.getElementById('b1').value = '✓ ' + data.bullets[0];
        if (data.bullets && data.bullets[1]) document.getElementById('b2').value = '✓ ' + data.bullets[1];
        if (data.bullets && data.bullets[2]) document.getElementById('b3').value = '✓ ' + data.bullets[2];

        if (data.seo) {
          document.getElementById('seoBox').classList.remove('hidden');
          document.getElementById('seoResult').value = data.seo;
        }
        drawCard();
      } catch (e) {
        alert('Ошибка ИИ: ' + e.message);
      } finally {
        btn.innerText = '✨ Придумать тексты и плашки';
        btn.disabled = false;
      }
    }

    drawCard();
  </script>
</body>
</html>
