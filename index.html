<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ozon Card Pro — Профессиональный редактор карточек</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; }
    canvas { max-height: 80vh; width: auto; max-width: 100%; box-shadow: 0 25px 60px rgba(0,0,0,0.7); border-radius: 14px; cursor: grab; }
    canvas:active { cursor: grabbing; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col lg:flex-row" translate="no">

  <!-- Панель управления -->
  <div class="w-full lg:w-[500px] bg-slate-800 p-6 overflow-y-auto h-screen border-r border-slate-700 space-y-5">
    <div class="flex items-center justify-between">
      <h1 class="text-xl font-black text-blue-400 tracking-wide">OZON CARD STUDIO</h1>
      <div class="flex items-center gap-2">
        <select id="canvasFormat" onchange="changeCanvasFormat()" class="text-xs bg-slate-700 text-blue-300 px-2.5 py-1 rounded-lg font-semibold outline-none cursor-pointer">
          <option value="ozon">Ozon (900×1200)</option>
          <option value="square">Квадрат (900×900)</option>
          <option value="story">Сторис (1080×1920)</option>
        </select>
      </div>
    </div>

    <!-- 1. ИИ Автозаполнение -->
    <div class="bg-slate-900/70 p-4 rounded-xl border border-slate-700 space-y-3">
      <label class="block text-xs font-bold uppercase text-blue-400 tracking-wider">⚡ 1. Автозаполнение (Groq AI)</label>
      <input id="aiPrompt" type="text" placeholder="Напр.: Термопринт на одежду ТПУ" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-3 py-2 text-sm outline-none focus:border-blue-500">
      <button id="aiBtn" onclick="generateWithAI()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-2.5 rounded-lg text-sm transition shadow-lg">
        ✨ Придумать тексты и плашки
      </button>
    </div>

    <!-- 2. Фото товара и Логотипы -->
    <div class="bg-slate-900/70 p-4 rounded-xl border border-slate-700 space-y-3">
      <label class="block text-xs font-bold uppercase text-slate-400 tracking-wider">📸 2. Товар и Иконки / Лого</label>
      <div class="space-y-2 text-xs">
        <div>
          <span class="text-slate-400 block mb-1">Фото товара</span>
          <input id="imgUpload" type="file" accept="image/*" class="w-full text-xs text-slate-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
        </div>
        <div>
          <span class="text-slate-400 block mb-1">Логотип / Иконка поверх товара (PNG)</span>
          <input id="logoUpload" type="file" accept="image/*" class="w-full text-xs text-slate-300 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-purple-600 file:text-white hover:file:bg-purple-500 cursor-pointer">
        </div>
      </div>
      
      <div class="grid grid-cols-2 gap-2 pt-1">
        <button id="aiBgBtn" onclick="removeBgAI()" class="bg-purple-600 hover:bg-purple-500 text-xs font-bold py-2 rounded-lg text-white transition shadow">🧠 ИИ-вырезание фона</button>
        <button onclick="removeWhiteBg()" class="bg-slate-700 hover:bg-slate-600 text-xs font-bold py-2 rounded-lg text-slate-200 transition">🪄 Убрать 1-тон</button>
      </div>
      <p id="bgStatus" class="text-[11px] text-amber-400 hidden"></p>

      <div class="grid grid-cols-3 gap-2 pt-1 text-xs">
        <div>
          <span class="text-slate-400 block mb-1">Масштаб</span>
          <input id="imgScale" type="range" min="20" max="180" value="90" class="w-full" oninput="drawCard()">
        </div>
        <div>
          <span class="text-slate-400 block mb-1">Смещение X</span>
          <input id="imgX" type="range" min="-300" max="300" value="0" class="w-full" oninput="drawCard()">
        </div>
        <div>
          <span class="text-slate-400 block mb-1">Смещение Y</span>
          <input id="imgY" type="range" min="-300" max="300" value="20" class="w-full" oninput="drawCard()">
        </div>
      </div>
    </div>

    <!-- 3. Стили и Палитра -->
    <div class="bg-slate-900/70 p-4 rounded-xl border border-slate-700 space-y-3">
      <label class="block text-xs font-bold uppercase text-slate-400 tracking-wider">🎨 3. Стили и Палитра</label>
      
      <div class="grid grid-cols-2 gap-2">
        <div>
          <span class="text-[11px] text-slate-400 block mb-1">Шаблон дизайна</span>
          <select id="themeSelect" onchange="applyThemePreset()" class="w-full bg-slate-800 border border-slate-600 rounded-lg px
